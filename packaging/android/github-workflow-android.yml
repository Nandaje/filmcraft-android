name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android (arm64-v8a & x86_64 APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@b2eb2eb2dc5fcf2ac1fd2ffd5ae2bffbdb3b247e # v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Check layering and host tests for filmcraft-android
        run: |
          cargo run -p xtask --locked -- layers
          cargo test -p filmcraft-android --locked
      - name: Build Android native libraries (arm64-v8a, x86_64)
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o packaging/android/app/src/main/jniLibs \
            build --release --locked -p filmcraft-android
      - name: Assemble Android APK
        working-directory: packaging/android
        run: gradle assembleRelease --no-daemon
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: filmcraft-android-apk
          path: packaging/android/app/build/outputs/apk/release/*.apk
